<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found · SlideQuiz</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: light dark; --bg: #fff; --fg: #171717; --muted: #6b6b6b; --btn: #171717; --btnfg: #fff; }
      @media (prefers-color-scheme: dark) { :root { --bg: #000; --fg: #ededed; --muted: #9a9a9a; --btn: #f2f2f2; --btnfg: #0a0a0a; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; padding: 24px 16px; text-align: center; }
      .big { font-size: 96px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; margin: 0; opacity: 0.9; }
      h1 { font-size: 22px; margin: 16px 0 8px; }
      p { color: var(--muted); margin: 0 0 28px; font-size: 15px; }
      a { display: inline-block; background: var(--btn); color: var(--btnfg); text-decoration: none; padding: 10px 18px; border-radius: 10px; font-weight: 500; font-size: 14px; }
      .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 40px; color: var(--fg); background: none; padding: 0; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <a class="logo" href="/"><img src="/favicon.svg" width="24" height="24" alt="" /> SlideQuiz</a>
      <p class="big">404</p>
      <h1>This page has wandered off</h1>
      <p>The link might be old or mistyped.</p>
      <a href="/">Go to SlideQuiz</a>
    </main>
  </body>
</html>
