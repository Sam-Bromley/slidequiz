<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SlideQuiz</title>
    <meta name="description" content="Upload your lecture slides, PDFs or Word documents and get clean, concise notes, practice questions and flashcards. Free, and your files stay on your device." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://slidequiz.co.uk/" />
    <meta property="og:title" content="SlideQuiz" />
    <meta property="og:description" content="Turn your lecture slides into clean notes, practice questions and flashcards. Free." />
    <meta property="og:url" content="https://slidequiz.co.uk/" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var t = "light", auto = false, times = "21:00-06:00";
        try {
          t = localStorage.getItem("slidequiz:appearance") || "light";
          if (localStorage.getItem("slidequiz:v7") !== "1") t = t === "warm" ? "warm" : "light";
          auto = localStorage.getItem("slidequiz:nightauto") === "1";
          times = localStorage.getItem("slidequiz:nighttimes") || times;
        } catch (e) {}
        var m = /^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/.exec(times) || [0, 21, 0, 6, 0];
        var d = new Date(), now = d.getHours() * 60 + d.getMinutes(), a = m[1] * 60 + +m[2], b = m[3] * 60 + +m[4];
        if (auto && a !== b && (a < b ? now >= a && now < b : now >= a || now < b)) t = "warm";
        var light = t === "light";
        var c = document.documentElement.classList;
        c.toggle("dark", !light);
        c.toggle("warm", t === "warm");
      })();
    </script>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>SlideQuiz needs JavaScript enabled.</noscript>
    <script type="module" src="assets/app.js"></script>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "3d409bb66a33402c8c96a0ad9e1ed039"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
