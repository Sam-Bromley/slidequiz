# Deploys the Supabase Edge Functions whenever their code changes, so nothing has to be copied into the dashboard by hand.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Without it this does nothing (and doesn't fail).
name: Deploy Supabase functions
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", "supabase/config.toml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: supabase-functions
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT: oksfbksrfrqsbtmjqtfz
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "SUPABASE_ACCESS_TOKEN isn't set, so nothing was deployed."; exit 0; fi
          for f in supabase/functions/*/; do
            name=$(basename "$f")
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$PROJECT" --no-verify-jwt --use-api
          done
